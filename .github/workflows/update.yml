name: Update profile README

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # lets you press "Run workflow" by hand
  push:
    branches: [main]
    paths: [generate.py, ".github/workflows/update.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image helper (for the dot-matrix avatar)
        run: pip install pillow

      - name: Generate animated README
        run: python generate.py
        env:
          GH_LOGIN: omsenjalia
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Weather location for the window (Ahmedabad). Change these two numbers to move it.
          WEATHER_LAT: "23.0225"
          WEATHER_LON: "72.5714"
          # India time = +330 minutes
          TZ_OFFSET_MINUTES: "330"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: refresh profile"
          git push
